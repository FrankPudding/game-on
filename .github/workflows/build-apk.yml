name: Build and Release APK

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Set up signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Trim whitespace from secrets
          KEYSTORE_BASE64_TRIMMED=$(printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]')
          KEYSTORE_PASSWORD_TRIMMED=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '[:space:]')
          KEY_PASSWORD_TRIMMED=$(printf '%s' "$KEY_PASSWORD" | tr -d '[:space:]')
          KEY_ALIAS_TRIMMED="game-on"

          # Debug: print lengths and first/last 10 chars of keystore
          echo "KEYSTORE_BASE64 original length: ${#KEYSTORE_BASE64}"
          echo "KEYSTORE_BASE64 trimmed length: ${#KEYSTORE_BASE64_TRIMMED}"
          echo "KEYSTORE_BASE64 first 10 chars: '${KEYSTORE_BASE64_TRIMMED:0:10}'"
          echo "KEYSTORE_BASE64 last 10 chars: '${KEYSTORE_BASE64_TRIMMED: -10}'"
          echo "KEYSTORE_PASSWORD length: ${#KEYSTORE_PASSWORD_TRIMMED}"
          echo "KEY_PASSWORD length: ${#KEY_PASSWORD_TRIMMED}"
          echo "KEY_ALIAS length: ${#KEY_ALIAS_TRIMMED}"

          # Use printf for base64 decode to avoid echo newline issues
          printf '%s' "$KEYSTORE_BASE64_TRIMMED" | base64 --decode > android/app/game-on-release.jks

          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD_TRIMMED
          keyPassword=$KEY_PASSWORD_TRIMMED
          keyAlias=game-on
          storeFile=game-on-release.jks
          EOF

      - name: Get version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: |
          flutter build apk --release \
            --build-name="${{ steps.version.outputs.version }}" \
            --build-number="${{ github.run_number }}"

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/game-on-${{ steps.version.outputs.version }}.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-on-${{ steps.version.outputs.version }}.apk
          path: build/app/outputs/flutter-apk/game-on-${{ steps.version.outputs.version }}.apk

      - name: Check if tag is on main
        id: check_main
        run: |
          git fetch origin main --depth=1
          if git merge-base --is-ancestor ${{ github.sha }} origin/main; then
            echo "on_main=true" >> $GITHUB_OUTPUT
          else
            echo "on_main=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        if: steps.check_main.outputs.on_main == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/game-on-${{ steps.version.outputs.version }}.apk
          generate_release_notes: true
