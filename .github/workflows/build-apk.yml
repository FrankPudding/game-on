name: Build and Release APK

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      # WARNING: versionCode (build-number) is scoped to this workflow's run_number.
      # If multiple workflows publish to the same track (e.g., Play Console), versionCode collisions WILL occur.
      # Use a centralized versioning strategy (e.g., monotonic counter, GitVersion, or a dedicated version file) for multi-workflow setups.
      - name: Build APK
        run: flutter build apk --release --build-number ${{ github.run_number }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true